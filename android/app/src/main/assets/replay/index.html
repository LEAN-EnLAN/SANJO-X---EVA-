<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Eva demo</title>
<link rel="icon" href="static/icons/icon-192.png">
<style>
@font-face{font-family:Inter;src:url(static/fonts/inter-var.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#000;--ink:#f4f3f0;--mu:#9b9996;--rule:#2a2a2a;--eva:#1fe5c4;--alarm:#ff2a1f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

/* menu */
#menu{min-height:100%;display:flex;flex-direction:column;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:880px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:15px;letter-spacing:.02em}
.lang{display:flex;border:1px solid var(--rule)}
.lang button{padding:6px 12px;font-size:13px;letter-spacing:.06em;color:var(--mu)}
.lang button+button{border-left:1px solid var(--rule)}
.lang button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--eva)}
h1{font-weight:400;font-size:clamp(34px,7vw,64px);line-height:1.02;letter-spacing:-.02em;margin:40px 0 10px}
.sub{color:var(--mu);font-size:15px;margin-bottom:32px}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:28px 0 10px}
.list{border-top:1px solid var(--rule)}
.row{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px 4px;border-bottom:1px solid var(--rule);transition:background .2s}
.row:hover,.row:focus-visible{background:#0b0b0b;outline:none}
.row .n{font-size:13px;color:var(--mu);width:28px;flex:none;font-variant-numeric:tabular-nums}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:400;font-size:clamp(18px,3.2vw,24px)}
.row .t span{display:block;color:var(--mu);font-size:14px;margin-top:2px}
.row .go{flex:none;width:22px;height:22px;opacity:.6}
.scenes{display:flex;flex-wrap:wrap;gap:8px}
.scenes button{border:1px solid var(--rule);padding:9px 14px;font-size:14px;color:var(--mu)}
.scenes button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.scenes button.al[aria-pressed=true]{border-color:var(--alarm)}
.foot{margin-top:auto;padding-top:36px;color:var(--mu);font-size:13px;display:flex;gap:18px;flex-wrap:wrap}

/* viewer */
#viewer{position:fixed;inset:0;background:#000;display:none}
#viewer.on{display:block}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#bar{position:fixed;right:max(8px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.82);border:1px solid var(--rule);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:4px;transition:opacity .35s}
#bar.dim{opacity:.35}
#bar:not(.open) > :not(#bHandle){display:none}
#bar.open #bHandle{display:none}
#scn{writing-mode:vertical-rl;transform:rotate(180deg);padding:8px 0!important;max-height:30vh}
#frame.phone{left:50%;width:min(100%,430px);transform:translateX(-50%);border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
/* the band's own screen: 16:9 in the middle on a big screen, the whole screen on a band-shaped one */
#frame.wrist{left:50%;top:50%;right:auto;bottom:auto;width:min(100vw,960px,177.78vh);height:auto;aspect-ratio:16/9;transform:translate(-50%,-50%);border:1px solid var(--rule)}
body.band #frame.wrist{inset:0;width:100%;height:100%;aspect-ratio:auto;transform:none;border:0}
body.band #bar,body.band #hint{display:none}
@media (max-width:600px){#frame.phone{border:0}}
#bar button{width:40px;height:40px;display:grid;place-items:center}
#bar button:hover{background:#111}
#bar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
#scn{font-size:13px;color:var(--mu);padding:0 8px;white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
#scn.al{color:var(--alarm)}
#hint{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);z-index:11;background:rgba(0,0,0,.85);border:1px solid var(--rule);padding:8px 14px;font-size:13px;color:var(--ink);pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#hint.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main id="menu">
  <div class="top">
    <p class="brand">Eva <span style="color:var(--mu)">by WearMeds</span> · <span data-t="demo">demo</span></p>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="es" aria-pressed="false">ES</button></div>
  </div>
  <h1 data-t="h1">Pick a view.</h1>
  <p class="sub" data-t="sub">Each one opens full screen. Switch views or scenes any time from the small button in the corner.</p>

  <p class="lab" data-t="lScene">Scene</p>
  <div class="scenes" id="scenes"></div>

  <p class="lab" data-t="lView">View</p>
  <div class="list" id="views"></div>

  <div class="foot">
    <a href="board.html" data-t="board">All views side by side</a>
    <a href="../" data-t="site">Back to the site</a>
  </div>
</main>

<section id="viewer" aria-label="Eva view">
  <iframe id="frame" title="Eva" allow="fullscreen; microphone; camera; autoplay"></iframe>
  <div id="hint"></div>
  <div id="bar" role="toolbar" aria-label="Demo controls">
    <button id="bHandle" aria-label="Show controls" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="18" r="1.2"/></svg></button>
    <button id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button id="bPrev" aria-label="Previous scene"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="scn"></span>
    <button id="bNext" aria-label="Next scene"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button id="bView" aria-label="Next view"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="8" height="14"/><rect x="13" y="5" width="8" height="6"/><rect x="13" y="13" width="8" height="6"/></svg></button>
    <button id="bFull" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</section>

<script>
(function () {
  "use strict";
  var SCENES = [
    { id: "s1", en: "Normal day", es: "Día normal" },
    { id: "s2", en: "Cardiac arrest", es: "Paro cardíaco", al: true },
    { id: "s3", en: "Help on the way", es: "La ayuda va en camino", al: true },
    { id: "s4", en: "AED taken", es: "DEA retirado", al: true },
    { id: "s5", en: "Records on Earth", es: "Registros en la Tierra" },
    { id: "s6", en: "Solar storm", es: "Tormenta solar", al: true }
  ];
  var PHONE = { s1: "home", s2: "emergency", s3: "emergency", s4: "emergency", s5: "home", s6: "storm" };
  // the band's screen per scene (captured from the app at 640 × 360 in wristband mode)
  var WRIST = { s1: "wrist", s2: "wrist-emergency", s3: "wrist-emergency", s4: "wrist-emergency", s5: "wrist", s6: "wrist-storm" };
  var VIEWS = [
    { id: "4B", kind: "phone", en: ["Ana · seat 4B", "Passenger phone · the patient"], es: ["Ana · asiento 4B", "Teléfono del pasajero · la paciente"] },
    { id: "3B", kind: "phone", en: ["Leo · seat 3B", "Passenger phone · starts CPR"], es: ["Leo · asiento 3B", "Teléfono del pasajero · empieza la RCP"] },
    { id: "1B", kind: "phone", en: ["Tomás · seat 1B", "Passenger phone · brings the AED"], es: ["Tomás · asiento 1B", "Teléfono del pasajero · trae el DEA"] },
    { id: "dash", kind: "wide", en: ["Crew dashboard", "The ship hub's view of everyone"], es: ["Panel de la tripulación", "Lo que ve el hub de la nave"] },
    { id: "station", kind: "wide", en: ["Emergency station", "The wall cabinet's screen"], es: ["Estación de emergencia", "La pantalla del gabinete"] },
    { id: "ground", kind: "wide", en: ["Mission control · Earth", "Signed records, received and acknowledged"], es: ["Control de misión · Tierra", "Registros firmados, recibidos y confirmados"] },
    { id: "w4B", kind: "wrist", seat: "4B", en: ["Wristband · Ana 4B", "The band's own screen · the patient"], es: ["Pulsera · Ana 4B", "La pantalla de la pulsera · la paciente"] },
    { id: "w3B", kind: "wrist", seat: "3B", en: ["Wristband · Leo 3B", "The band's own screen · starts CPR"], es: ["Pulsera · Leo 3B", "La pantalla de la pulsera · empieza la RCP"] },
    { id: "w1B", kind: "wrist", seat: "1B", en: ["Wristband · Tomás 1B", "The band's own screen · brings the AED"], es: ["Pulsera · Tomás 1B", "La pantalla de la pulsera · trae el DEA"] }
  ];
  // Wristband mode, the app's own rule (head.html): a landscape screen at most 480 px high and at least 8:5, or a
  // tiny square. A band-shaped screen opens the chosen seat's band view full screen, with no menu.
  // ?mode=wristband / ?mode=phone override it for this page.
  var BAND = "(orientation: landscape) and (max-height: 480px) and (min-aspect-ratio: 8/5), (max-width: 340px) and (max-height: 340px)";
  var T = {
    en: { demo: "demo", h1: "Pick a view.", sub: "Each one opens full screen. Switch views or scenes any time from the small button in the corner.", lScene: "Scene", lView: "View", board: "All views side by side", site: "Back to the site", full: "Full screen isn't available here" },
    es: { demo: "demo", h1: "Elegí una vista.", sub: "Cada una se abre en pantalla completa. Cambiá de vista o de escena cuando quieras desde el botón de la esquina.", lScene: "Escena", lView: "Vista", board: "Todas las vistas juntas", site: "Volver al sitio", full: "Pantalla completa no disponible acá" }
  };
  var $ = function (id) { return document.getElementById(id); };
  var lang = "en", scene = 0, view = 0;
  try { if (localStorage.getItem("eva-replay-lang") === "es") lang = "es"; } catch (e) {}
  var qs = new URLSearchParams(location.search);
  if (qs.get("lang") === "es") lang = "es";
  var forced = qs.get("mode") === "wristband" || qs.get("mode") === "phone" ? qs.get("mode") : null;
  var bandMq = window.matchMedia ? matchMedia(BAND) : { matches: false };
  function isBand() { return forced ? forced === "wristband" : bandMq.matches; }
  var seat = "4B";
  try { var ss = localStorage.getItem("eva-replay-seat"); if (["4B", "3B", "1B"].indexOf(ss) >= 0) seat = ss; } catch (e) {}
  function viewIndex(id) { var k = -1; VIEWS.forEach(function (v, i) { if (v.id === id) k = i; }); return k; }
  function seatOf(v) { return v.kind === "wrist" ? v.seat : v.kind === "phone" ? v.id : null; }
  // in the Android app the site and the old board are not reachable: hide those links
  var inApp = / EvaAndroid\//.test(navigator.userAgent) || location.hostname === "appassets.androidplatform.net";

  function svgGo() { return '<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 19L19 5M9 5h10v10"/></svg>'; }
  function renderMenu() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function (e) { e.textContent = T[lang][e.getAttribute("data-t")]; });
    document.querySelectorAll(".lang [data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang)); });
    $("scenes").innerHTML = SCENES.map(function (s, i) {
      return '<button data-i="' + i + '" class="' + (s.al ? "al" : "") + '" aria-pressed="' + (i === scene) + '">' + s[lang] + "</button>";
    }).join("");
    $("views").innerHTML = VIEWS.map(function (v, i) {
      return '<button class="row" data-v="' + i + '"><span class="n">0' + (i + 1) + '</span><span class="t"><b>' + v[lang][0] + "</b><span>" + v[lang][1] + "</span></span>" + svgGo() + "</button>";
    }).join("");
  }
  function page() {
    var s = SCENES[scene].id, v = VIEWS[view];
    if (v.kind === "wrist") return "v/" + s + "-" + v.seat + "-" + WRIST[s] + ".html";
    return "v/" + s + "-" + (v.kind === "phone" ? v.id + "-" + PHONE[s] : v.id) + ".html";
  }
  var hintT = 0;
  function hint(text) { var h = $("hint"); h.textContent = text; h.classList.add("on"); clearTimeout(hintT); hintT = setTimeout(function () { h.classList.remove("on"); }, 1800); }
  function open(push) {
    var sv = seatOf(VIEWS[view]);
    if (sv) { seat = sv; try { localStorage.setItem("eva-replay-seat", seat); } catch (e) {} }
    document.body.classList.toggle("band", isBand() && VIEWS[view].kind === "wrist");
    $("frame").src = page();
    $("frame").className = VIEWS[view].kind === "phone" ? "phone" : VIEWS[view].kind === "wrist" ? "wrist" : "";
    $("viewer").classList.add("on");
    $("menu").style.display = "none";
    var s = SCENES[scene];
    $("scn").textContent = s[lang]; $("scn").className = s.al ? "al" : "";
    var h = "#view=" + VIEWS[view].id + "&scene=" + s.id;
    if (push !== false && location.hash !== h) history.replaceState(null, "", h);
    wake();
  }
  function menu() {
    $("viewer").classList.remove("on"); $("frame").src = "about:blank";
    $("menu").style.display = ""; history.replaceState(null, "", location.pathname + location.search);
    renderMenu();
  }
  function step(d) { scene = (scene + d + SCENES.length) % SCENES.length; open(); hint(SCENES[scene][lang]); }
  function nextView() { view = (view + 1) % VIEWS.length; open(); hint(VIEWS[view][lang][0]); }
  function full() {
    var d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { try { var p = req.call(el); if (p && p.catch) p.catch(function () { hint(T[lang].full); }); } catch (e) { hint(T[lang].full); } }
    else hint(T[lang].full);
  }
  // bar fades when idle, comes back on any touch or move
  var idle = 0;
  function wake() { $("bar").classList.remove("dim"); clearTimeout(idle); idle = setTimeout(function () { $("bar").classList.add("dim"); }, 2500); }
  var shut = 0;
  function expand(on) { $("bar").classList.toggle("open", on); $("bHandle").setAttribute("aria-expanded", String(on)); clearTimeout(shut); if (on) shut = setTimeout(function () { expand(false); }, 6000); }
  ["mousemove", "touchstart", "keydown"].forEach(function (ev) { document.addEventListener(ev, wake, { passive: true }); });
  $("bar").addEventListener("pointerenter", wake);

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.lang) { lang = b.dataset.lang; try { localStorage.setItem("eva-replay-lang", lang); } catch (x) {} renderMenu(); }
    else if (b.dataset.i) { scene = +b.dataset.i; renderMenu(); }
    else if (b.dataset.v) { view = +b.dataset.v; open(); }
  });
  $("bMenu").onclick = menu; $("bPrev").onclick = function () { step(-1); }; $("bNext").onclick = function () { step(1); };
  $("bView").onclick = nextView; $("bFull").onclick = full;
  $("bHandle").onclick = function () { expand(true); };
  $("bar").addEventListener("click", function (e) { if (e.target.closest("button") && e.target.closest("button").id !== "bHandle") expand(true); });
  document.addEventListener("keydown", function (e) {
    if (!$("viewer").classList.contains("on")) return;
    if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "f" || e.key === "F") full(); else if (e.key === "Escape" && !document.fullscreenElement) menu();
    else if (e.key === "v" || e.key === "V") nextView();
  });

  // the captured screens talk to their parent: story buttons move the scenario, seat links switch phones
  window.addEventListener("message", function (e) {
    var m = e.data; if (!m || m.eva !== "replay") return;
    if (m.type === "story") {
      var a = m.action, to = -1;
      if ((a === "going" || a === "have-it") && scene < 2) to = 2;
      else if (a === "aed" && scene < 3) to = 3;
      else if (a === "close" && scene < 4) to = 4;
      if (to >= 0) { scene = to; open(); hint(SCENES[scene][lang]); }
    } else if (m.type === "seat") {
      var k = viewIndex((VIEWS[view].kind === "wrist" ? "w" : "") + m.seat); if (k >= 0) view = k; open();
    } else if (m.type === "key") { step(m.key === "ArrowRight" ? 1 : -1); }
  });

  // deep links: #view=4B&scene=s2
  function fromHash() {
    var h = new URLSearchParams(location.hash.slice(1)), v = h.get("view"), s = h.get("scene");
    if (!v) return false;
    VIEWS.forEach(function (x, i) { if (x.id === v) view = i; });
    SCENES.forEach(function (x, i) { if (x.id === s) scene = i; });
    open(false); return true;
  }
  // a band-shaped screen: straight to the chosen seat's band, full screen; back to its phone when it is not
  function toBand() {
    var k = viewIndex("w" + (seatOf(VIEWS[view]) || seat));
    if (k >= 0) { view = k; open(); }
  }
  function toPhone() {
    var k = viewIndex(VIEWS[view].seat || seat);
    if (k >= 0) { view = k; open(); }
  }
  renderMenu();
  if (inApp) document.querySelectorAll(".foot a").forEach(function (a) { a.style.display = "none"; });
  var opened = fromHash();
  if (isBand() && (!opened || VIEWS[view].kind !== "wrist")) toBand();
  if (!forced && bandMq.addEventListener) bandMq.addEventListener("change", function () {
    if (bandMq.matches) toBand();
    else if ($("viewer").classList.contains("on") && VIEWS[view].kind === "wrist") toPhone();
  });
  window.addEventListener("hashchange", function () { if (!fromHash()) { if (isBand()) toBand(); else menu(); } });
})();
</script>
</body>
</html>
