<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:dark;background:#000;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Eva Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap">
<style>
/* Layout: a ship's watch board. Story bar on top, the passenger phone on the left, the crew
   dashboard on the right with the ground or the station under it. Black canvas, Inter 400,
   1px rules, square corners (the landing's language); the app screens keep their own look. */
:root{
  --bg:#0c0c0c; --ink:#f9f7f4; --rule:#3d3d3d; --muted:rgba(249,247,244,.6); --faint:rgba(249,247,244,.36);
  --stage:#151316; --alarm:#ff5a4e;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-xs:12px; --t-s:13px; --t-m:15px; --t-l:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t-m)/1.35 var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,p{margin:0;font-weight:400}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-radius:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
code{font-family:var(--mono);font-size:.92em}

.shell{display:flex;flex-direction:column;min-height:100%;padding-block:12px 16px;gap:12px}

/* header */
.top{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;border-bottom:1px solid var(--rule);padding-bottom:10px}
.top h1{font-size:var(--t-l);letter-spacing:-.01em}
.top .note{color:var(--muted);font-size:var(--t-s);flex:1;min-width:0}
.live{font-size:var(--t-s)}
.lang{display:flex;border:1px solid var(--rule);font-size:var(--t-xs);letter-spacing:.06em}
.lang button{padding:3px 8px;color:var(--muted)}
.lang button+button{border-left:1px solid var(--rule)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.live summary{cursor:pointer;list-style:none;text-transform:uppercase;letter-spacing:.06em;font-size:var(--t-xs)}
.live summary::-webkit-details-marker{display:none}
.live summary::before{content:"+ "}
.live[open] summary::before{content:"− "}
.live .body{position:absolute;right:0;top:calc(100% + 1px);z-index:20;width:min(560px,100%);background:var(--bg);border:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--muted)}
.live pre{margin:0;padding:10px 12px;border:1px solid var(--rule);color:var(--ink);font:12px/1.5 var(--mono);overflow-x:auto;white-space:pre}
.live b{color:var(--ink);font-weight:400}

/* story bar */
.story{display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.ctl{display:flex;border-right:1px solid var(--rule)}
.ctl button{width:44px;height:52px;display:grid;place-items:center;border-right:1px solid var(--rule)}
.ctl button:last-child{border-right:0}
.ctl button:hover{background:var(--stage)}
.ctl svg{width:16px;height:16px;fill:currentColor}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));min-width:0}
.step{position:relative;text-align:left;padding:8px 12px 10px;border-right:1px solid var(--rule);color:var(--faint);display:flex;flex-direction:column;gap:2px;min-width:0}
.step:last-child{border-right:0}
.step .n{font-size:var(--t-xs);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.step .l{font-size:var(--t-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step:hover{color:var(--muted)}
.step.done{color:var(--muted)}
.step[aria-current="step"]{color:var(--ink)}
.step[aria-current="step"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);transform-origin:0 50%}
.step.alarm .n::after{content:" ●";color:var(--alarm)}
body.playing .step[aria-current="step"]::after{animation:fill var(--dwell,7s) linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.caption{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,32ch);gap:6px 24px;align-items:baseline;min-height:calc(3 * 1.35em)}
.caption p{max-width:78ch;text-wrap:pretty}
.caption .hint{color:var(--muted);font-size:var(--t-s);text-align:right}
.caption .hint b{color:var(--ink);font-weight:400}

/* stage */
.stage{flex:1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;min-height:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.label .who{color:var(--ink)}
.seg{display:flex;border:1px solid var(--rule)}
.seg button{flex:1;padding:7px 10px;border-right:1px solid var(--rule);color:var(--muted);font-size:var(--t-s);text-align:left;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button small{display:block;font-size:var(--t-xs);color:var(--faint)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[aria-pressed="true"] small{color:rgba(12,12,12,.6)}
.seg button.cue:not([aria-pressed="true"]){color:var(--ink);box-shadow:inset 0 -2px 0 var(--alarm)}

.phone{position:relative;border:1px solid var(--rule);background:#000;padding:8px;align-self:flex-start}
.frame{position:relative;overflow:hidden;background:var(--stage)}
.frame iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#000;display:block}
.frame iframe.next{visibility:hidden}
.pane{position:relative;border:1px solid var(--rule);min-height:0}
.right{display:grid;grid-template-rows:auto minmax(0,1.35fr) auto minmax(0,1fr);gap:8px}
.lowerhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lowerhead .seg{min-width:260px}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:24px;color:var(--muted);background:var(--bg)}
.placeholder p:first-child{color:var(--ink);font-size:var(--t-l)}

.tabs{display:none}

/* desktop: fit the viewport */
@media (min-width:1000px){
  html,body{overflow:hidden}
  .shell{height:100%}
}
/* phone / tablet: one view at a time */
@media (max-width:999px){
  .stage{display:block}
  .tabs{display:flex;border:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
  .tabs button{flex:1;padding:10px 4px;border-right:1px solid var(--rule);color:var(--muted);font-size:var(--t-s)}
  .tabs button:last-child{border-right:0}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
  .right{display:block}
  .right > *{margin-top:8px}
  .stage [data-panel]{display:none}
  .stage[data-show="phone"] [data-panel="phone"],
  .stage[data-show="dash"] [data-panel="dash"],
  .stage[data-show="lower"] [data-panel="lower"]{display:flex}
  .stage[data-show="dash"] .right,.stage[data-show="lower"] .right{display:flex;flex-direction:column}
  .col.left{align-items:stretch;margin-top:8px}
  .phone{align-self:center}
  .pane{height:72vh;flex:none}
  .lowerhead #lower-seg{display:none}
  .steps{grid-template-columns:repeat(3,minmax(0,1fr))}
  .step:nth-child(3){border-right:0}
  .step:nth-child(-n+3){border-bottom:1px solid var(--rule)}
  .ctl{flex-direction:column}
  .ctl button{border-right:0;border-bottom:1px solid var(--rule);height:auto;flex:1}
  .ctl button:last-child{border-bottom:0}
  .caption{grid-template-columns:1fr;min-height:0}
  .caption .hint{text-align:left}
  .top .note{flex-basis:100%;order:3}
}
@media (max-width:420px){
  .step{padding:6px 8px 8px}
  .step .l{font-size:var(--t-s);white-space:normal}
  .seg button{padding:6px 6px}
}
@media (prefers-reduced-motion:reduce){body.playing .step[aria-current="step"]::after{animation:none}}
</style>

<div class="shell">
  <header class="top">
    <h1>Eva · replay</h1>
    <p class="note" data-i18n="note"></p>
    <div class="lang" role="group" aria-label="Language / Idioma" id="lang">
      <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
      <button type="button" data-lang="es" aria-pressed="false" lang="es">ES</button>
    </div>
    <details class="live" id="live">
      <summary data-i18n="live"></summary>
      <div class="body" data-i18n="liveBody"></div>
    </details>
  </header>

  <nav class="story" aria-label="Story" data-i18n-aria="story">
    <div class="ctl">
      <button type="button" id="prev" data-i18n-aria="prev"><svg viewBox="0 0 16 16"><path d="M4 2h2v12H4zM14 2v12L7 8z"/></svg></button>
      <button type="button" id="play" aria-label="Play" aria-pressed="false"><svg viewBox="0 0 16 16" id="play-ic"><path d="M4 2l10 6-10 6z"/></svg></button>
      <button type="button" id="next" data-i18n-aria="next"><svg viewBox="0 0 16 16"><path d="M10 2h2v12h-2zM2 2v12l7-6z"/></svg></button>
    </div>
    <div class="steps" id="steps"></div>
  </nav>

  <div class="caption" aria-live="polite">
    <p id="cap"></p>
    <p class="hint" id="hint"></p>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button type="button" role="tab" data-tab="phone" aria-selected="true" data-i18n="tPhone"></button>
    <button type="button" role="tab" data-tab="dash" aria-selected="false" data-i18n="tCrew"></button>
    <button type="button" role="tab" data-tab="lower" data-sub="ground" aria-selected="false" data-i18n="tGround"></button>
    <button type="button" role="tab" data-tab="lower" data-sub="station" aria-selected="false" data-i18n="tStation"></button>
  </div>

  <main class="stage" id="stage" data-show="phone">
    <section class="col left" data-panel="phone" data-i18n-aria="phone">
      <div class="label"><span data-i18n="phone"></span><span class="who" id="who"></span></div>
      <div class="seg" id="seats">
        <button type="button" data-seat="4B" aria-pressed="true">4B Ana<small data-i18n="s4B"></small></button>
        <button type="button" data-seat="3B" aria-pressed="false">3B Leo<small data-i18n="s3B"></small></button>
        <button type="button" data-seat="1B" aria-pressed="false">1B Tomás<small data-i18n="s1B"></small></button>
      </div>
      <div class="phone"><div class="frame" id="f-phone"></div></div>
    </section>
    <section class="col right">
      <div class="label" data-panel="dash"><span data-i18n="dash"></span><span class="who" data-i18n="dashWho"></span></div>
      <div class="pane frame" id="f-dash" data-panel="dash"></div>
      <div class="lowerhead" data-panel="lower">
        <div class="label"><span id="lower-label">Ground · flight surgeon</span></div>
        <div class="seg" id="lower-seg">
          <button type="button" data-lower="ground" aria-pressed="true" data-i18n="bGround"></button>
          <button type="button" data-lower="station" aria-pressed="false" data-i18n="bStation"></button>
        </div>
      </div>
      <div class="pane frame" id="f-lower" data-panel="lower"></div>
    </section>
  </main>
</div>

    var availW = mobile ? document.documentElement.clientWidth - 32 - 18 : 420;
    p.scale = Math.min(1, availW / 390, availH / 844);
    p.el.style.width = Math.round(390 * p.scale) + "px";
    p.el.style.height = Math.round(844 * p.scale) + "px";
    ["dash", "lower"].forEach(function (k) {
      var s = slots[k], r = s.el.getBoundingClientRect();
      s.scale = mobile ? 1 : Math.min(1, r.width / s.w);
      s.lw = mobile ? r.width : s.w; s.lh = r.height / s.scale;
    });
    Object.keys(slots).forEach(function (k) { slots[k].el.querySelectorAll("iframe").forEach(function (f) { size(k, f); }); });
  }
  function size(k, f) {
    var s = slots[k];
    if (k === "phone") { f.style.width = "390px"; f.style.height = "844px"; f.style.transform = "scale(" + s.scale + ")"; return; }
    f.style.width = s.lw + "px"; f.style.height = s.lh + "px";
    f.style.transform = s.scale === 1 ? "none" : "scale(" + s.scale + ")";
  }

  // load every slot's new page hidden, then show them all in the same frame (the three-phones moment)
  var batch = 0;
  function swap(targets) {
    var id = ++batch, pending = 0, fresh = [];
    Object.keys(targets).forEach(function (k) {
      var s = slots[k], src = targets[k];
      var old = s.el.querySelector("iframe:not(.next)");
      s.el.querySelectorAll(".placeholder").forEach(function (e) { e.remove(); });
      if (!src) { s.el.querySelectorAll("iframe").forEach(function (f) { f.remove(); }); s.el.appendChild(placeholder()); return; }
      if (old && old.getAttribute("data-src") === src) return;
      s.el.querySelectorAll("iframe.next").forEach(function (f) { f.remove(); });
      var f = document.createElement("iframe");
      f.className = "next"; f.setAttribute("data-src", src); f.setAttribute("title", k === "phone" ? "Passenger phone" : k === "dash" ? "Crew dashboard" : "Ground or station");
      f.setAttribute("tabindex", "0");
      size(k, f);
      pending++;
      f.addEventListener("load", function once() { f.removeEventListener("load", once); if (--pending === 0) reveal(); });
      f.src = "v/" + src;
      s.el.appendChild(f);
      fresh.push(f);
    });
    function reveal() {
      if (id !== batch) return;
      fresh.forEach(function (f) {
        var host = f.parentNode; if (!host) return;
        host.querySelectorAll("iframe:not(.next)").forEach(function (o) { if (o !== f) o.remove(); });
        f.classList.remove("next");
      });
    }
    setTimeout(reveal, 2500);
  }
  function placeholder() {
    var d = document.createElement("div");
    d.className = "placeholder";
    d.innerHTML = t("ph");
    return d;
  }

  // ---------------------------------------------------------------- render
  var stepsEl = $("steps");
  STEPS.forEach(function (s, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "step" + (s.alarm ? " alarm" : "");
    b.innerHTML = '<span class="n">' + String(i + 1).padStart(2, "0") + '</span><span class="l"></span>';
    b.addEventListener("click", function () { stop(); go(i, true); });
    stepsEl.appendChild(b);
  });

  function go(i, follow) {
    cur = Math.max(0, Math.min(STEPS.length - 1, i));
    var s = STEPS[cur], st = DATA.states[cur];
    if (follow) seat = s.focus;
    stepsEl.querySelectorAll(".step").forEach(function (b, j) {
      if (j === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      b.classList.toggle("done", j < cur);
      // restart the progress line
      if (j === cur && playing) { b.style.animation = "none"; void b.offsetWidth; b.style.animation = ""; }
    });
    $("cap").textContent = stepText(cur, 1);
    $("hint").innerHTML = stepText(cur, 2);
    try { history.replaceState(null, "", "#" + s.hash); } catch (e) {}
    render();
    layout();
  }
  function render() {
    var st = DATA.states[cur], s = STEPS[cur];
    document.querySelectorAll("#seats [data-seat]").forEach(function (b) {
      var on = b.getAttribute("data-seat") === seat;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.classList.toggle("cue", !on && b.getAttribute("data-seat") === s.focus && cur > 0);
    });
    $("who").textContent = SEATS[seat];
    document.querySelectorAll("#lower-seg [data-lower]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lower") === lower ? "true" : "false"); });
    $("lower-label").textContent = t(lower === "ground" ? "lGround" : "lStation");
    document.querySelectorAll("#tabs [data-tab]").forEach(function (t) {
      var show = $("stage").getAttribute("data-show"), sub = t.getAttribute("data-sub");
      t.setAttribute("aria-selected", t.getAttribute("data-tab") === show && (!sub || sub === lower) ? "true" : "false");
    });
    swap({ phone: st.phone[seat], dash: st.dash, lower: lower === "ground" ? st.ground : st.station });
  }

  // ---------------------------------------------------------------- play / pause
  function tick() { if (cur >= STEPS.length - 1) { stop(); return; } go(cur + 1, true); timer = setTimeout(tick, DWELL); }
  function start() {
    if (cur >= STEPS.length - 1) go(0, true);
    playing = true; document.body.classList.add("playing");
    document.body.style.setProperty("--dwell", DWELL + "ms");
    $("play").setAttribute("aria-pressed", "true"); $("play").setAttribute("aria-label", t("pause"));
    $("play-ic").innerHTML = '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>';
    go(cur, false);
    timer = setTimeout(tick, DWELL);
  }
  function stop() {
    playing = false; clearTimeout(timer); document.body.classList.remove("playing");
    $("play").setAttribute("aria-pressed", "false"); $("play").setAttribute("aria-label", t("play"));
    $("play-ic").innerHTML = '<path d="M4 2l10 6-10 6z"/>';
  }
  $("play").addEventListener("click", function () { playing ? stop() : start(); });
  $("prev").addEventListener("click", function () { stop(); go(cur - 1, true); });
  $("next").addEventListener("click", function () { stop(); go(cur + 1, true); });
  document.addEventListener("keydown", function (e) {
    if (e.target.matches && e.target.matches("input, textarea, select, summary")) return;
    if (e.key === "ArrowRight") { stop(); go(cur + 1, true); }
    else if (e.key === "ArrowLeft") { stop(); go(cur - 1, true); }
  });

  document.querySelectorAll("#seats [data-seat]").forEach(function (b) {
    b.addEventListener("click", function () { seat = b.getAttribute("data-seat"); render(); });
  });
  document.querySelectorAll("#lower-seg [data-lower]").forEach(function (b) {
    b.addEventListener("click", function () { lower = b.getAttribute("data-lower"); render(); });
  });
  document.querySelectorAll("#tabs [data-tab]").forEach(function (t) {
    t.addEventListener("click", function () {
      $("stage").setAttribute("data-show", t.getAttribute("data-tab"));
      if (t.getAttribute("data-sub")) lower = t.getAttribute("data-sub");
      render(); layout();
    });
  });

  // ---------------------------------------------------------------- messages from the screens
  window.addEventListener("message", function (e) {
    var m = e.data;
    if (!m || m.eva !== "replay") return;
    if (m.type === "story") {
      stop();
      var a = m.action;
      if ((a === "going" || a === "have-it") && cur < 2) go(2, false);
      else if (a === "aed" && cur < 3) go(3, false);
      else if (a === "close" && cur < 4) go(4, false);
    } else if (m.type === "seat" && SEATS[m.seat]) {
      seat = m.seat; render();
    } else if (m.type === "key") {
      stop(); go(cur + (m.key === "ArrowRight" ? 1 : -1), true);
    }
  });

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (e) { e.innerHTML = t(e.getAttribute("data-i18n")).replace("{STATION}", DATA.station ? t("station") : ""); });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (e) { e.setAttribute("aria-label", t(e.getAttribute("data-i18n-aria"))); });
    $("play").setAttribute("aria-label", t(playing ? "pause" : "play"));
    stepsEl.querySelectorAll(".step .l").forEach(function (l, i) { l.textContent = T[lang].steps[i][0]; });
    document.querySelectorAll("#lang [data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
    $("cap").textContent = stepText(cur, 1);
    $("hint").innerHTML = stepText(cur, 2);
    $("lower-label").textContent = t(lower === "ground" ? "lGround" : "lStation");
    document.querySelectorAll(".placeholder").forEach(function (d) { d.innerHTML = t("ph"); });
    layout();
  }
  document.querySelectorAll("#lang [data-lang]").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      applyLang();
    });
  });

  window.addEventListener("resize", layout);
  var startAt = 0;
  STEPS.forEach(function (s, i) { if (location.hash === "#" + s.hash) startAt = i; });
  applyLang();
  go(startAt, true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  window.addEventListener("hashchange", function () { STEPS.forEach(function (s, i) { if (location.hash === "#" + s.hash && i !== cur) { stop(); go(i, true); } }); });
})();
</script>

</body></html>
