{% macro eva(state, art, size) %}<span class="eva-mascot relative inline-grid shrink-0 place-items-center {{ size }}" data-eva data-state="{{ state }}"><span class="eva-glow absolute -inset-1/4 rounded-full bg-eva-glow"></span><img src="/static/img/eva/eva-{{ art }}.webp" alt="Eva, the health copilot" class="eva-body relative size-full object-contain" draggable="false" decoding="async"></span>{% endmacro %}
{# the tab-bar avatar: Eva's face, which moves with her state but keeps its image #}
{% macro face(state, size) %}<span class="eva-mascot relative inline-grid shrink-0 place-items-center {{ size }}" data-eva data-eva-fixed data-state="{{ state }}"><span class="eva-glow absolute -inset-1/4 rounded-full bg-eva-glow"></span><img src="/static/img/eva/eva-face.webp" alt="Eva" class="eva-body relative size-full object-contain" draggable="false" decoding="async"></span>{% endmacro %}
