<script>
/* Wristband mode (APP-POLISH §9.1): pick phone or wristband before the first paint, and jump
   to the twin URL if the page and the screen shape disagree. ?mode=wristband|phone|auto overrides. */
(function () {
  var d = document.documentElement, path = location.pathname;
  if (!/^\/app(\/|$)/.test(path)) return;
  var W = "(orientation: landscape) and (max-height: 480px) and (min-aspect-ratio: 8/5), (max-width: 340px) and (max-height: 340px)";
  var q = new URLSearchParams(location.search), o = q.get("mode"), saved = null;
  try {
    if (o === "auto") localStorage.removeItem("eva-mode");
    else if (o === "wristband" || o === "phone") localStorage.setItem("eva-mode", o);
    saved = localStorage.getItem("eva-mode");
  } catch (e) { if (o === "wristband" || o === "phone") saved = o; }
  var mode = saved || (matchMedia(W).matches ? "wristband" : "phone");
  d.setAttribute("data-mode", mode);
  if (saved) d.setAttribute("data-mode-forced", saved);
  if (mode === "wristband" && !matchMedia(W).matches) d.setAttribute("data-letterbox", "");
  var wrist = /^\/app\/wrist/.test(path), seat = q.get("seat"), tail = seat ? "?seat=" + encodeURIComponent(seat) : "";
  var twins = { "eva": "eva", "ecg": "ecg", "emergency": "emergency", "storm": "storm" };
  if (mode === "wristband" && !wrist) {
    var k = path.replace(/^\/app\/?/, "");
    location.replace("/app/wrist" + (twins[k] ? "/" + twins[k] : "") + tail);
  } else if (mode === "phone" && wrist) {
    var w = path.replace(/^\/app\/wrist\/?/, "");
    location.replace("/app" + (twins[w] ? "/" + twins[w] : "") + tail);
  }
})();
</script>
