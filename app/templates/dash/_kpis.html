<section class="rounded-card border border-line bg-surface px-0 py-5">
  <div class="grid grid-cols-2 gap-y-5 divide-line md:grid-cols-5 md:divide-x">
  {% for k in items %}
    <div class="flex items-start justify-between gap-3 px-6">
      <div class="flex flex-col gap-2">
        <p class="text-xs uppercase tracking-label text-muted">{{ k.label }}</p>
        <p class="text-4xl tracking-tight text-ink tabular-nums">{{ k.value }}{% if !k.unit.is_empty() %}<span class="ml-1 text-base text-muted">{{ k.unit }}</span>{% endif %}</p>
        <p class="flex flex-wrap items-center gap-2 text-xs text-muted"><span class="inline-flex items-center gap-1 rounded-full border px-2.5 py-0.5 text-xs font-medium {{ crate::web::ui::badge(k.delta_tone) }}">{{ k.delta }}</span>{{ k.hint }}</p>
      </div>
      <span class="grid size-9 shrink-0 place-items-center rounded-full bg-raised text-muted">{{ crate::web::ui::ic(k.icon, 16)|safe }}</span>
    </div>
  {% endfor %}
  </div>
</section>
