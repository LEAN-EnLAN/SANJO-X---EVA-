[package]
name = "eva"
version = "0.3.2"
edition = "2021"
description = "Eva by WearMeds: AI health copilot server (astronaut PWA, crew/Earth dashboard, Eva Link protocol). Team Sanjo-X, NASA Space Apps 2026."
license = "MIT"
publish = false
default-run = "eva"

[[bin]]
name = "eva"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "trace", "set-header"] }
askama = "0.14"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
sha2 = "0.10"
# Ed25519 signatures on chain records (ring is already in the tree through rustls)
ring = "0.17"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls-native-roots"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
base64 = "0.22"
serde_urlencoded = "0.7"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
